<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>マリオメーカー2 お題ガチャ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 12px 40px;
  font-family: sans-serif;
  text-align: center;
  background: #f3f3f3;
  overflow-x: hidden;
}

h1 {
  font-size: 28px;
  margin: 10px 0 8px;
}

/* 結果はタイトルのすぐ下 */
#result {
  display: none;
  background: white;
  max-width: 520px;
  margin: 10px auto 15px;
  padding: 22px;
  border-radius: 20px;
  font-size: 20px;
  line-height: 1.7;
  box-shadow: 0 4px 15px #bbb;
}

#result.goldResult {
  border: 5px solid #ffd700;
  box-shadow:
    0 0 15px #ffd700,
    0 0 35px rgba(255,215,0,0.5);
}

.rank {
  font-size: 27px;
  font-weight: bold;
}

.subtitle {
  font-size: 16px;
  margin-bottom: 18px;
}

#drawButton,
#againButton {
  font-size: 22px;
  font-weight: bold;
  padding: 16px 28px;
  border: none;
  border-radius: 16px;
  background: #222;
  color: white;
  cursor: pointer;
}

#againButton {
  display: none;
  margin: 15px auto;
}

/* ガチャ演出 */
#gachaArea {
  position: relative;
  height: 300px;
  max-width: 550px;
  margin: 5px auto;
  overflow: hidden;
}

#capsule {
  display: none;
  position: absolute;
  left: 50%;
  top: -150px;

  width: 125px;
  height: 125px;

  transform: translateX(-50%);
  border-radius: 50%;
  border: 5px solid #aaa;

  background:
    linear-gradient(
      to bottom,
      #ffffff 0%,
      #ffffff 47%,
      #dddddd 48%,
      #dddddd 55%,
      #ffffff 56%,
      #ffffff 100%
    );

  box-shadow: 0 8px 15px rgba(0,0,0,0.25);
}

/* カプセル中央線 */
#capsule::after {
  content: "";
  position: absolute;
  left: -5px;
  right: -5px;
  top: 51%;
  height: 7px;
  background: #999;
}

/* 激レア */
#capsule.gold {
  border-color: #a87900;

  background:
    linear-gradient(
      135deg,
      #fff7b0,
      #ffd700,
      #fff5a0,
      #d89b00,
      #fff7c0,
      #ffd700
    );

  box-shadow:
    0 0 20px #ffd700,
    0 0 45px rgba(255,215,0,0.8);
}

#capsule.gold::after {
  background: #a87900;
}

/* ① 上から落ちる */
.fall {
  animation: fall 0.7s ease-in forwards;
}

@keyframes fall {
  0% {
    top: -150px;
  }

  75% {
    top: 165px;
  }

  88% {
    top: 140px;
  }

  100% {
    top: 155px;
  }
}

/* ② 少し揺れる */
.shake {
  top: 155px;
  animation: shake 0.55s linear;
}

@keyframes shake {
  0% {
    transform: translateX(-50%) rotate(0deg);
  }

  15% {
    transform: translateX(-50%) rotate(-7deg);
  }

  30% {
    transform: translateX(-50%) rotate(7deg);
  }

  45% {
    transform: translateX(-50%) rotate(-6deg);
  }

  60% {
    transform: translateX(-50%) rotate(6deg);
  }

  75% {
    transform: translateX(-50%) rotate(-3deg);
  }

  100% {
    transform: translateX(-50%) rotate(0deg);
  }
}

/* ③ 開く */
.open {
  top: 155px;
  animation: openCapsule 0.45s forwards;
}

@keyframes openCapsule {
  0% {
    transform: translateX(-50%) scale(1);
    opacity: 1;
  }

  50% {
    transform: translateX(-50%) scale(1.25);
  }

  100% {
    transform: translateX(-50%) scale(2);
    opacity: 0;
  }
}

/* 激レア表示 */
#rareNotice {
  display: none;
  position: absolute;
  width: 100%;
  top: 35px;
  font-size: 29px;
  font-weight: bold;
  color: #b8860b;
}

/* スキップ */
#skipButton {
  display: none;
  margin: 0 auto 15px;
  padding: 12px 25px;
  border: 2px solid #555;
  border-radius: 20px;
  background: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.small {
  margin-top: 25px;
  font-size: 13px;
}
</style>
</head>

<body>

<h1>🎮 マリオメーカー2 お題ガチャ</h1>

<!-- 結果をタイトルのすぐ下に配置 -->
<div id="result"></div>

<div class="subtitle">
ガチャを引いてコースのお題を決めよう！<br>
✨ 金カプセルが出たら激レア！ ✨
</div>

<button id="drawButton">
🎲 ガチャを引く！
</button>

<div id="gachaArea">

  <div id="rareNotice">
    ✨ 激レア！ ✨
  </div>

  <div id="capsule"></div>

</div>

<button id="skipButton">
⏩ スキップ
</button>

<button id="againButton">
🎲 もう一回引く！
</button>

<div class="small">
※非公式のファン向けお題ジェネレーターです。
</div>


<script>

const styles = [
  "スーパーマリオブラザーズ",
  "スーパーマリオブラザーズ3",
  "スーパーマリオワールド",
  "New スーパーマリオブラザーズ U",
  "スーパーマリオ 3Dワールド"
];

const themes = [
  "地上",
  "地下",
  "水中",
  "砂漠",
  "雪原",
  "空",
  "森",
  "お化け屋敷",
  "飛行船",
  "城"
];

const normalChallenges = [
  "コインをたくさん使ったコース",
  "ジャンプを楽しめるコース",
  "敵をうまく避けて進むコース",
  "土管をたくさん使ったコース",
  "隠し道があるコース",
  "初心者でも遊べるコース",
  "ゴール前にちょっとした罠があるコース",
  "パワーアップアイテムを活用するコース",
  "動く足場を使ったコース",
  "スピード感のあるコース",
  "敵を10体以上使ったコース",
  "コインを50枚以上配置したコース",
  "上下に大きく移動するコース",
  "最後にボスが待っているコース"
];

const hardChallenges = [
  "敵をできるだけ倒さずにクリアできるコース",
  "コインを取らないように進むコース",
  "パワーアップなしでもクリアできるコース",
  "ジャンプのタイミングが重要なコース",
  "最後にボス戦があるコース",
  "時間ギリギリを狙うコース",
  "落下しそうで落下しないコース",
  "フェイクルートを入れたコース",
  "敵を利用しないと先へ進めないコース"
];

const rareChallenges = [
  "👑 ヨッシーを最後まで連れてゴールできるコース",
  "🔥 3Dワールド限定の超スピードコース",
  "👑 スタートからゴールが見えるのに簡単には行けないコース",
  "🔥 ボスを3体以上登場させるコース",
  "👑 1画面を中心に仕掛けを作るコース",
  "🔥 一本道なのに超難しいコース",
  "👑 初見では仕掛けが分からない謎解きコース",
  "🔥 アクションと謎解きを両方入れたコース",
  "👑 ヨッシーを使わないとクリアできないコース",
  "🔥 3Dワールドでネコマリオを活用するコース"
];

/* 絶対100秒以上 */
const times = [
  100,
  120,
  150,
  180,
  200,
  250,
  300,
  400,
  500
];

const capsule = document.getElementById("capsule");
const result = document.getElementById("result");
const drawButton = document.getElementById("drawButton");
const skipButton = document.getElementById("skipButton");
const againButton = document.getElementById("againButton");
const rareNotice = document.getElementById("rareNotice");

let currentResult;
let timers = [];
let finished = false;

function random(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function clearTimers() {
  timers.forEach(function(timer) {
    clearTimeout(timer);
  });

  timers = [];
}

function createResult() {

  const roll = Math.random();

  let type;
  let rank;
  let challenge;

  /* 激レア 5% */
  if (roll < 0.05) {

    type = "rare";
    rank = "🌟 激レアお題 🌟";
    challenge = random(rareChallenges);

  }

  /* むずかしい 25% */
  else if (roll < 0.30) {

    type = "hard";
    rank = "🔥 むずかしいお題 🔥";
    challenge = random(hardChallenges);

  }

  /* 普通 70% */
  else {

    type = "normal";
    rank = "⚪ ノーマルお題";
    challenge = random(normalChallenges);

  }

  return {
    type: type,
    rank: rank,
    style: random(styles),
    theme: random(themes),
    time: random(times),
    challenge: challenge
  };
}


function startGacha() {

  clearTimers();

  finished = false;
  currentResult = createResult();

  result.style.display = "none";
  result.className = "";

  drawButton.style.display = "none";
  againButton.style.display = "none";

  rareNotice.style.display = "none";

  capsule.style.display = "block";
  capsule.className = "";

  /* 激レアなら金 */
  if (currentResult.type === "rare") {
    capsule.classList.add("gold");
  }

  skipButton.style.display = "block";

  /* まず落下 */
  capsule.classList.add("fall");


  /*
  ==========================
  0.7秒後
  着地
  ==========================
  */

  timers.push(setTimeout(function() {

    if (finished) return;

    capsule.classList.remove("fall");

    capsule.style.top = "155px";

  }, 700));


  /*
  ==========================
  着地してから約1秒停止
  ==========================
  */

  timers.push(setTimeout(function() {

    if (finished) return;

    capsule.style.top = "";

    if (currentResult.type === "rare") {

      capsule.className = "gold shake";
      rareNotice.style.display = "block";

    } else {

      capsule.className = "shake";

    }

  }, 1700));


  /*
  ==========================
  揺れたあと開く
  ==========================
  */

  timers.push(setTimeout(function() {

    if (finished) return;

    if (currentResult.type === "rare") {

      capsule.className = "gold open";

    } else {

      capsule.className = "open";

    }

  }, 2300));


  /*
  ==========================
  お題を表示
  ==========================
  */

  timers.push(setTimeout(function() {

    showResult();

  }, 2750));

}


function showResult() {

  if (finished) return;

  finished = true;

  clearTimers();

  capsule.style.display = "none";
  capsule.style.top = "";

  rareNotice.style.display = "none";
  skipButton.style.display = "none";

  result.innerHTML =
    '<div class="rank">' +
    currentResult.rank +
    '</div>' +

    '<br>' +

    '🎨 <b>ゲームスキン</b><br>' +
    currentResult.style +

    '<br><br>' +

    '🌍 <b>シーン</b><br>' +
    currentResult.theme +

    '<br><br>' +

    '⏱️ <b>制限時間</b><br>' +
    currentResult.time +
    '秒' +

    '<br><br>' +

    '🎯 <b>チャレンジ</b><br>' +
    currentResult.challenge;

  if (currentResult.type === "rare") {
    result.className = "goldResult";
  } else {
    result.className = "";
  }

  result.style.display = "block";
  againButton.style.display = "block";

  /* 結果が出たら上へ戻す */
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


drawButton.addEventListener("click", startGacha);

againButton.addEventListener("click", startGacha);

/* スキップなら即結果 */
skipButton.addEventListener("click", showResult);

</script>

</body>
</html>
