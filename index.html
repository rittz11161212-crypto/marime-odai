<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>マリメ2 お題ガチャ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  font-family: sans-serif;
  text-align: center;
  background: #f3f3f3;
  overflow-x: hidden;
}

h1 {
  font-size: 30px;
  margin-bottom: 5px;
}

.subtitle {
  font-size: 16px;
  margin-bottom: 20px;
}

#drawButton {
  font-size: 23px;
  font-weight: bold;
  padding: 17px 32px;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  background: #222;
  color: white;
}

/* ガチャ演出エリア */
#gachaArea {
  position: relative;
  height: 330px;
  max-width: 550px;
  margin: 10px auto;
  overflow: hidden;
}

/* カプセル本体 */
#capsule {
  position: absolute;
  width: 125px;
  height: 125px;
  border-radius: 50%;
  left: 50%;
  top: -150px;
  transform: translateX(-50%);
  display: none;
  border: 5px solid #aaa;
  background:
    linear-gradient(
      to bottom,
      white 0%,
      white 48%,
      #d8d8d8 49%,
      #d8d8d8 54%,
      white 55%,
      white 100%
    );
  box-shadow: 0 8px 15px rgba(0,0,0,0.25);
}

/* カプセル中央線 */
#capsule::after {
  content: "";
  position: absolute;
  left: -5px;
  right: -5px;
  top: 52%;
  height: 7px;
  background: #999;
}

/* 激レア金カプセル */
#capsule.gold {
  border-color: #a97900;
  background:
    linear-gradient(
      135deg,
      #fff4a8 0%,
      #ffd700 25%,
      #fff8c7 45%,
      #d99b00 65%,
      #fff0৬0 85%,
      #ffd700 100%
    );
  box-shadow:
    0 0 20px #ffd700,
    0 0 45px rgba(255,215,0,0.8);
}

#capsule.gold::after {
  background: #a97900;
}

/* 上から落下 */
.fall {
  animation: fall 0.55s ease-in forwards;
}

@keyframes fall {
  0% {
    top: -150px;
  }

  75% {
    top: 175px;
  }

  88% {
    top: 145px;
  }

  100% {
    top: 165px;
  }
}

/* 着地後ガタガタ */
.shake {
  animation: shake 0.65s linear;
}

@keyframes shake {
  0%   { transform: translateX(-50%) rotate(0deg); }
  10%  { transform: translateX(-50%) rotate(-8deg); }
  20%  { transform: translateX(-50%) rotate(8deg); }
  30%  { transform: translateX(-50%) rotate(-10deg); }
  40%  { transform: translateX(-50%) rotate(10deg); }
  50%  { transform: translateX(-50%) rotate(-7deg); }
  60%  { transform: translateX(-50%) rotate(7deg); }
  70%  { transform: translateX(-50%) rotate(-4deg); }
  80%  { transform: translateX(-50%) rotate(4deg); }
  100% { transform: translateX(-50%) rotate(0deg); }
}

/* 開く瞬間 */
.open {
  animation: openCapsule 0.35s forwards;
}

@keyframes openCapsule {
  0% {
    transform: translateX(-50%) scale(1);
    opacity: 1;
  }

  60% {
    transform: translateX(-50%) scale(1.35);
  }

  100% {
    transform: translateX(-50%) scale(2);
    opacity: 0;
  }
}

/* 金カプセルのキラキラ文字 */
#rareNotice {
  display: none;
  position: absolute;
  width: 100%;
  top: 40px;
  font-size: 30px;
  font-weight: bold;
  color: #b8860b;
  animation: rareFlash 0.4s infinite alternate;
}

@keyframes rareFlash {
  from {
    transform: scale(1);
    opacity: 0.7;
  }

  to {
    transform: scale(1.12);
    opacity: 1;
  }
}

/* スキップ */
#skipButton {
  display: none;
  margin: 0 auto 20px;
  padding: 11px 25px;
  border: 2px solid #555;
  border-radius: 20px;
  background: white;
  font-size: 16px;
  cursor: pointer;
}

/* 結果 */
#result {
  display: none;
  background: white;
  max-width: 520px;
  margin: 15px auto;
  padding: 25px;
  border-radius: 20px;
  font-size: 20px;
  line-height: 1.8;
  box-shadow: 0 4px 15px #bbb;
  animation: resultAppear 0.4s ease-out;
}

#result.goldResult {
  border: 5px solid #ffd700;
  box-shadow:
    0 0 15px #ffd700,
    0 0 35px rgba(255,215,0,0.45);
}

@keyframes resultAppear {
  from {
    transform: scale(0.7);
    opacity: 0;
  }

  to {
    transform: scale(1);
    opacity: 1;
  }
}

.rank {
  font-size: 27px;
  font-weight: bold;
}

#againButton {
  display: none;
  margin: 20px auto;
  font-size: 21px;
  font-weight: bold;
  padding: 15px 27px;
  border: none;
  border-radius: 15px;
  background: #222;
  color: white;
  cursor: pointer;
}

.small {
  margin-top: 25px;
  font-size: 13px;
}
</style>
</head>

<body>

<h1>🎮 マリメ2 お題ガチャ</h1>

<div class="subtitle">
カプセルから今日のお題が出てくる！<br>
✨金カプセルが出たら激レア！✨
</div>

<button id="drawButton">
🎲 ガチャを引く！
</button>

<div id="gachaArea">

  <div id="rareNotice">
    ✨ GOLD!! ✨
  </div>

  <div id="capsule"></div>

</div>

<button id="skipButton">
⏩ スキップ
</button>

<div id="result"></div>

<button id="againButton">
🎲 もう一回引く！
</button>

<div class="small">
※非公式のファン向けお題ジェネレーターです。
</div>

<script>

const styles = [
  "スーパーマリオブラザーズ",
  "スーパーマリオブラザーズ3",
  "スーパーマリオワールド",
  "New スーパーマリオブラザーズ U",
  "スーパーマリオ 3Dワールド"
];

const themes = [
  "地上",
  "地下",
  "水中",
  "砂漠",
  "雪原",
  "空",
  "森",
  "お化け屋敷",
  "飛行船",
  "城"
];

const normalChallenges = [
  "コインをたくさん使ったコース",
  "ジャンプを楽しめるコース",
  "敵をうまく避けて進むコース",
  "土管をたくさん使ったコース",
  "隠し道があるコース",
  "初心者でも遊べるコース",
  "ゴール前にちょっとした罠があるコース",
  "パワーアップアイテムを活用するコース",
  "動く足場を使ったコース",
  "スピード感のあるコース",
  "敵を10体以上使ったコース",
  "コインを50枚以上配置したコース",
  "上下に大きく移動するコース",
  "ボスが最後に待っているコース"
];

const hardChallenges = [
  "敵をできるだけ倒さずにクリアできるコース",
  "コインを取らないように進むコース",
  "パワーアップなしでもクリアできるコース",
  "ジャンプのタイミングが重要なコース",
  "最後にボス戦があるコース",
  "時間ギリギリを狙うコース",
  "落下しそうで落下しないコース",
  "フェイクルートを入れたコース",
  "最初と最後がつながって見えるコース",
  "敵を利用しないと先へ進めないコース"
];

const rareChallenges = [
  "👑 ヨッシーを最後まで連れてゴールできるコース",
  "🔥 3Dワールド限定の超スピードコース",
  "👑 スタート地点からゴールが見えるのに簡単には行けないコース",
  "🔥 ボスを3体以上登場させるコース",
  "👑 1画面を中心に仕掛けを作るコース",
  "🔥 一本道なのに超難しいコース",
  "👑 初見では仕掛けが分からない謎解きコース",
  "🔥 アクションと謎解きを両方入れたコース",
  "👑 ヨッシーを使わないと絶対にクリアできないコース",
  "🔥 3Dワールドでネコマリオを活用するコース"
];

const times = [
  100,
  120,
  150,
  180,
  200,
  250,
  300,
  400,
  500
];

const capsule = document.getElementById("capsule");
const result = document.getElementById("result");
const drawButton = document.getElementById("drawButton");
const skipButton = document.getElementById("skipButton");
const againButton = document.getElementById("againButton");
const rareNotice = document.getElementById("rareNotice");

let timers = [];
let currentResult = null;
let finished = false;

function random(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function clearTimers() {
  timers.forEach(timer => clearTimeout(timer));
  timers = [];
}

function createResult() {

  const roll = Math.random();

  let rank;
  let challenge;
  let type;

  /* 5% 激レア */
  if (roll < 0.05) {

    type = "rare";
    rank = "🌟 激レアお題 🌟";
    challenge = random(rareChallenges);

  }

  /* 25% むずかしい */
  else if (roll < 0.30) {

    type = "hard";
    rank = "🔥 むずかしいお題 🔥";
    challenge = random(hardChallenges);

  }

  /* 70% 普通 */
  else {

    type = "normal";
    rank = "⚪ ノーマルお題";
    challenge = random(normalChallenges);

  }

  return {
    type: type,
    rank: rank,
    style: random(styles),
    theme: random(themes),
    time: random(times),
    challenge: challenge
  };
}

function startGacha() {

  clearTimers();

  finished = false;

  currentResult = createResult();

  drawButton.style.display = "none";
  againButton.style.display = "none";
  result.style.display = "none";

  result.className = "";

  rareNotice.style.display = "none";

  capsule.style.display = "block";
  capsule.className = "";

  /*
    激レアだけ最初から金色
  */
  if (currentResult.type === "rare") {
    capsule.classList.add("gold");
  }

  /*
    上から落下
  */
  capsule.classList.add("fall");

  skipButton.style.display = "block";

  /*
    落下終了後
  */
  timers.push(setTimeout(() => {

    if (finished) return;

    capsule.classList.remove("fall");

    if (currentResult.type === "rare") {
      capsule.className = "gold shake";
      rareNotice.style.display = "block";
    } else {
      capsule.className = "shake";
    }

  }, 600));

  /*
    約1秒待って開く
  */
  timers.push(setTimeout(() => {

    if (finished) return;

    if (currentResult.type === "rare") {
      capsule.className = "gold open";
    } else {
      capsule.className = "open";
    }

  }, 1500));

  /*
    結果表示
  */
  timers.push(setTimeout(() => {

    showResult();

  }, 1800));
}

function showResult() {

  if (finished) return;

  finished = true;

  clearTimers();

  capsule.style.display = "none";
  rareNotice.style.display = "none";
  skipButton.style.display = "none";

  result.innerHTML =
    '<div class="rank">' +
    currentResult.rank +
    '</div>' +

    '<br>' +

    '🎨 <b>ゲームスキン</b><br>' +
    currentResult.style +

    '<br><br>' +

    '🌍 <b>シーン</b><br>' +
    currentResult.theme +

    '<br><br>' +

    '⏱️ <b>制限時間</b><br>' +
    currentResult.time +
    '秒' +

    '<br><br>' +

    '🎯 <b>チャレンジ</b><br>' +
    currentResult.challenge;

  if (currentResult.type === "rare") {
    result.className = "goldResult";
  } else {
    result.className = "";
  }

  result.style.display = "block";
  againButton.style.display = "block";
}

drawButton.addEventListener("click", startGacha);

againButton.addEventListener("click", startGacha);

skipButton.addEventListener("click", showResult);

</script>

</body>
</html>
